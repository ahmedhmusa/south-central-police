<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thaa Atoll Police — Command App</title>
<meta name="theme-color" content="#0A1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A1220'/%3E%3Cpath d='M50 18l26 10v18c0 20-11 33-26 36-15-3-26-16-26-36V28z' fill='none' stroke='%232E6FF2' stroke-width='5'/%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#0A1220;
  --panel:#111C30;
  --panel-2:#16233B;
  --line:rgba(255,255,255,0.08);
  --paper:#EEF1F6;
  --paper-panel:#FFFFFF;
  --paper-line:rgba(10,18,32,0.08);
  --blue:#1FA7A0;
  --blue-soft:rgba(31,167,160,0.15);
  --amber:#E2A33D;
  --amber-soft:rgba(226,163,61,0.15);
  --red:#D6524A;
  --red-soft:rgba(214,82,74,0.15);
  --green:#3FA66B;
  --green-soft:rgba(63,166,107,0.15);
  --text-hi:#F4F7FC;
  --text-mid:rgba(244,247,252,0.68);
  --text-lo:rgba(244,247,252,0.42);
  --text-hi-l:#0B1424;
  --text-mid-l:rgba(11,20,36,0.62);
  --text-lo-l:rgba(11,20,36,0.40);
  --radius-l:22px;
  --radius-m:16px;
  --radius-s:11px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
}
[data-theme="dark"]{
  --bg:var(--ink); --card:var(--panel); --card-2:var(--panel-2);
  --border:var(--line); --hi:var(--text-hi); --mid:var(--text-mid); --lo:var(--text-lo);
}
[data-theme="light"]{
  --bg:var(--paper); --card:var(--paper-panel); --card-2:#F6F8FC;
  --border:var(--paper-line); --hi:var(--text-hi-l); --mid:var(--text-mid-l); --lo:var(--text-lo-l);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--hi);
  font-family:var(--font-body);
  transition:background .35s ease, color .35s ease;
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:var(--font-display);}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}

#app{max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:96px; position:relative;}

/* ---------- Header ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  background:linear-gradient(180deg, var(--bg) 70%, transparent);
  backdrop-filter:blur(14px);
  display:flex; align-items:flex-start; justify-content:space-between;
}
.brand-mark{display:flex; gap:10px; align-items:center;}
.crest{width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,var(--blue),#1B4FC4);
  display:flex;align-items:center;justify-content:center;flex-shrink:0; box-shadow:0 4px 14px rgba(31,167,160,0.35);}
.brand-text .t1{font-size:15px; font-weight:700; letter-spacing:0.2px; line-height:1.15;}
.brand-text .t2{font-size:12px; color:var(--mid); margin-top:1px;}
.topbar-actions{display:flex; gap:8px;}
.icon-btn{
  width:36px;height:36px;border-radius:11px; border:1px solid var(--border);
  background:var(--card); display:flex;align-items:center;justify-content:center; color:var(--hi);
}
.icon-btn svg{width:17px;height:17px;}

/* ---------- Layout helpers ---------- */
.screen{padding:4px 18px 8px;}
.section{margin-top:26px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-title{font-size:17px; font-weight:700;}
.section-sub{font-size:12.5px; color:var(--mid); margin-top:2px;}
.link-btn{font-size:13px; color:var(--blue); font-weight:600; background:none; border:none; padding:0;}

/* ---------- Cards ---------- */
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l);
  padding:18px;
}
.glass{
  background:linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
}

/* status pill */
.status-row{display:flex; align-items:center; gap:8px; margin-top:9px;}
.status-pill{
  display:inline-flex; align-items:center; gap:6px; padding:5px 11px 5px 8px; border-radius:99px;
  background:var(--green-soft); color:var(--green); font-size:12px; font-weight:700;
}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green); box-shadow:0 0 0 3px rgba(63,166,107,0.25);}
.status-pill.amber{background:var(--amber-soft); color:var(--amber);}
.status-pill.amber .dot{background:var(--amber); box-shadow:0 0 0 3px rgba(226,163,61,0.25);}
.meta-line{font-size:12.5px; color:var(--mid); margin-top:8px;}

/* Global filter bar */
.filterbar{display:flex; gap:8px; overflow-x:auto; padding:2px 18px 0; margin-top:16px;}
.chip{
  flex-shrink:0; padding:8px 14px; border-radius:99px; border:1px solid var(--border);
  background:var(--card); color:var(--mid); font-size:13px; font-weight:600; white-space:nowrap;
}
.chip.active{background:var(--blue); border-color:var(--blue); color:#fff;}
.scope-row{display:flex; gap:8px; padding:10px 18px 0; overflow-x:auto;}
.scope-chip{flex-shrink:0; padding:6px 12px; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--lo); border:1px solid transparent;}
.scope-chip.active{color:var(--blue); background:var(--blue-soft);}

/* Atoll overview cards */
.atoll-card{
  border-radius:var(--radius-l); padding:20px; color:#fff; position:relative; overflow:hidden;
  margin-bottom:14px; border:1px solid var(--border);
}
.atoll-card.hero{background:linear-gradient(150deg,#0F4A48 0%, #0A2523 75%);}
.atoll-card .glow{position:absolute; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,rgba(31,167,160,0.35),transparent 70%); top:-90px; right:-70px;}
.atoll-top{display:flex; justify-content:space-between; align-items:flex-start; position:relative;}
.atoll-name{font-size:18px; font-weight:700;}
.atoll-sub{font-size:12px; color:rgba(255,255,255,0.6); margin-top:2px;}
.trend-badge{font-size:12px; font-weight:700; padding:4px 9px; border-radius:99px;}
.trend-badge.up{background:rgba(214,82,74,0.22); color:#F5A29C;}
.trend-badge.down{background:rgba(63,166,107,0.22); color:#9EE6B8;}
.big-stat-row{display:flex; gap:22px; margin-top:18px; position:relative;}
.big-stat .num{font-family:var(--font-display); font-size:34px; font-weight:700; line-height:1;}
.big-stat .lbl{font-size:11.5px; color:rgba(255,255,255,0.55); margin-top:5px;}
.mini-stats{display:flex; gap:10px; margin-top:16px; position:relative;}
.mini-stat{flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:13px; padding:10px 8px; text-align:center;}
.mini-stat .n{font-size:16px; font-weight:700;}
.mini-stat .l{font-size:10px; color:rgba(255,255,255,0.55); margin-top:2px;}
.atoll-cta{
  margin-top:16px; width:100%; padding:12px; border-radius:13px; border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.08); color:#fff; font-weight:600; font-size:13.5px; position:relative;
  display:flex; align-items:center; justify-content:center; gap:6px;
}

/* Insight cards */
.insight-card{display:flex; gap:12px; padding:14px; border-radius:var(--radius-m); border:1px solid var(--border); background:var(--card); margin-bottom:10px;}
.insight-icon{width:34px;height:34px;border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.insight-icon svg{width:16px;height:16px;}
.insight-text{font-size:13.5px; line-height:1.45; color:var(--hi);}
.insight-text b{font-weight:700;}
.insight-tag{font-size:11px; color:var(--lo); margin-top:3px;}

/* Quick actions */
.qa-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.qa-btn{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:14px 12px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; text-align:left;
}
.qa-icon{width:32px;height:32px;border-radius:9px;background:var(--blue-soft); display:flex; align-items:center; justify-content:center;}
.qa-icon svg{width:16px;height:16px; stroke:var(--blue);}
.qa-btn .qa-label{font-size:12.5px; font-weight:600; line-height:1.25;}

/* Activity cards */
.activity-card{border:1px solid var(--border); background:var(--card); border-radius:var(--radius-m); padding:14px; margin-bottom:10px;}
.activity-top{display:flex; justify-content:space-between; gap:10px;}
.activity-type{font-size:10.5px; font-weight:700; color:var(--blue); background:var(--blue-soft); padding:3px 8px; border-radius:99px; display:inline-block;}
.activity-title{font-size:14.5px; font-weight:700; margin-top:8px;}
.activity-desc{font-size:12.5px; color:var(--mid); margin-top:4px; line-height:1.4;}
.activity-meta{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;}
.activity-meta .im{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--lo);}
.activity-meta svg{width:12px;height:12px;}

/* Station rows */
.station-row{display:flex; align-items:center; gap:12px; padding:13px; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--card); margin-bottom:8px;}
.station-avatar{width:40px;height:40px;border-radius:11px;background:var(--card-2); display:flex;align-items:center;justify-content:center; font-size:13px; font-weight:700; color:var(--blue); flex-shrink:0; border:1px solid var(--border);}
.station-info{flex:1; min-width:0;}
.station-name{font-size:14px; font-weight:700;}
.station-oic{font-size:12px; color:var(--mid); margin-top:1px;}
.station-stats{display:flex; gap:14px; margin-top:6px;}
.station-stats .s{font-size:11px; color:var(--lo);}
.station-stats .s b{color:var(--hi); font-weight:700; font-size:12px;}
.trend-arrow{width:26px;height:26px;border-radius:8px; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.trend-arrow.up{background:var(--red-soft);}
.trend-arrow.down{background:var(--green-soft);}
.trend-arrow svg{width:13px;height:13px;}

/* Leadership card */
.profile-card{display:flex; gap:13px; align-items:center; padding:14px; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--card); margin-bottom:9px;}
.avatar-ring{width:48px;height:48px;border-radius:50%; background:linear-gradient(150deg,var(--blue),#1B4FC4); display:flex;align-items:center;justify-content:center; color:#fff; font-weight:700; font-size:15px; flex-shrink:0;}
.profile-info{flex:1; min-width:0;}
.profile-name{font-size:14px; font-weight:700;}
.profile-rank{font-size:12px; color:var(--blue); font-weight:600; margin-top:1px;}
.profile-pos{font-size:11.5px; color:var(--mid); margin-top:2px;}
.call-btn{width:34px;height:34px;border-radius:10px; background:var(--blue-soft); display:flex; align-items:center;justify-content:center; flex-shrink:0;}
.call-btn svg{width:15px;height:15px; stroke:var(--blue);}

/* Chart card */
.chart-card{border:1px solid var(--border); background:var(--card); border-radius:var(--radius-l); padding:16px 12px 8px;}
.chart-card .chart-title{font-size:13.5px; font-weight:700; padding:0 6px; margin-bottom:6px;}
.chart-wrap{position:relative; height:190px; width:100%;}

/* Bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  display:flex; justify-content:center;
}
.bottomnav-inner{
  max-width:560px; width:100%; margin:0 14px; margin-bottom:calc(env(safe-area-inset-bottom) + 12px);
  background:var(--card); border:1px solid var(--border); border-radius:20px;
  display:flex; padding:8px; backdrop-filter:blur(20px);
  box-shadow:0 10px 34px rgba(0,0,0,0.28);
}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0; border-radius:14px; background:none; border:none; color:var(--lo);}
.nav-item.active{color:var(--blue); background:var(--blue-soft);}
.nav-item svg{width:20px;height:20px;}
.nav-item .nl{font-size:10.5px; font-weight:600;}

/* Modal / sheet */
.sheet-backdrop{position:fixed; inset:0; background:rgba(4,8,16,0.55); z-index:100; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .25s ease;}
.sheet-backdrop.show{opacity:1; pointer-events:auto;}
.sheet{
  background:var(--bg); width:100%; max-width:560px; margin:0 auto; border-radius:24px 24px 0 0;
  max-height:88vh; overflow-y:auto; transform:translateY(24px); transition:transform .3s cubic-bezier(.2,.9,.25,1);
  border:1px solid var(--border); border-bottom:none;
}
.sheet-backdrop.show .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border); border-radius:99px; margin:10px auto 4px;}
.sheet-head{display:flex; justify-content:space-between; align-items:center; padding:12px 20px 4px;}
.sheet-title{font-size:17px; font-weight:700;}
.sheet-body{padding:14px 20px 30px;}
.field{margin-bottom:14px;}
.field label{font-size:12px; font-weight:600; color:var(--mid); display:block; margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--border); background:var(--card);
  color:var(--hi); font-size:14px; font-family:inherit;
}
.field textarea{resize:vertical; min-height:70px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.btn-primary{width:100%; padding:14px; border-radius:14px; background:var(--blue); color:#fff; font-weight:700; font-size:14.5px; border:none; margin-top:6px;}
.btn-ghost{width:100%; padding:13px; border-radius:14px; background:var(--card-2); color:var(--hi); font-weight:600; font-size:14px; border:1px solid var(--border); margin-top:8px;}
.toast{position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--hi); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:13px; font-weight:600; z-index:200; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.role-badge{font-size:11px; font-weight:700; color:var(--blue); background:var(--blue-soft); padding:5px 10px; border-radius:99px; display:inline-flex; align-items:center; gap:5px;}
.empty{text-align:center; padding:34px 12px; color:var(--lo); font-size:13px;}
.tab-content{animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.divider{height:1px; background:var(--border); margin:18px 0;}
.list-search{display:flex; gap:8px; align-items:center; padding:11px 13px; border-radius:13px; border:1px solid var(--border); background:var(--card); margin-bottom:14px;}
.list-search input{flex:1; border:none; background:none; outline:none; color:var(--hi); font-size:14px;}
.list-search svg{width:16px;height:16px; stroke:var(--lo); flex-shrink:0;}
.report-row{display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--border); background:var(--card); border-radius:var(--radius-m); margin-bottom:9px;}
.report-icon{width:38px;height:38px;border-radius:11px; background:var(--card-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.report-icon svg{width:17px;height:17px; stroke:var(--blue);}
.report-actions{display:flex; gap:6px;}
.report-actions button{padding:7px 11px; font-size:11.5px; font-weight:700; border-radius:9px; border:1px solid var(--border); background:var(--card-2); color:var(--hi);}

/* ============ V2 ADDITIONS ============ */
.kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.kpi-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px;}
.kpi-top{display:flex; justify-content:space-between; align-items:flex-start;}
.kpi-icon{width:30px;height:30px;border-radius:9px; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.kpi-icon svg{width:15px;height:15px;}
.kpi-num{font-family:var(--font-display); font-size:25px; font-weight:700; margin-top:10px;}
.kpi-lbl{font-size:11px; color:var(--lo); margin-top:2px;}
.kpi-sub{font-size:10.5px; color:var(--mid); margin-top:1px;}

.greet{font-size:20px; font-weight:700; font-family:var(--font-display);}
.greet-sub{font-size:12.5px; color:var(--mid); margin-top:3px;}
.count-strip{display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12px; font-weight:600; color:var(--blue); background:var(--blue-soft); padding:5px 11px; border-radius:99px;}

.status-tag{font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; display:inline-flex; align-items:center; gap:4px;}
.status-tag.normal{background:var(--green-soft); color:var(--green);}
.status-tag.attention{background:var(--amber-soft); color:var(--amber);}
.status-tag.high{background:var(--red-soft); color:var(--red);}
.status-tag .d{width:5px;height:5px;border-radius:50%;background:currentColor;}

.sort-row{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px;}

.stat-card-v2{border:1px solid var(--border); background:var(--card); border-radius:var(--radius-m); padding:14px; margin-bottom:9px;}
.sc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.sc-name{font-size:14.5px; font-weight:700;}
.sc-oic{font-size:12px; color:var(--mid); margin-top:2px;}
.sc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px;}
.sc-cell{text-align:center;}
.sc-cell .v{font-size:14px; font-weight:700;}
.sc-cell .l{font-size:9.5px; color:var(--lo); margin-top:1px;}
.sc-foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}

.tabs-row{display:flex; gap:6px; background:var(--card-2); padding:4px; border-radius:12px; margin-bottom:14px;}
.tab-pill{flex:1; text-align:center; padding:8px 0; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--mid); border:none; background:none;}
.tab-pill.active{background:var(--card); color:var(--hi); box-shadow:0 2px 6px rgba(0,0,0,0.15);}

.progress-track{height:8px; border-radius:99px; background:var(--card-2); overflow:hidden; display:flex;}
.progress-fill{height:100%;}

.island-chain{display:flex; align-items:center; overflow-x:auto; padding:16px 6px 20px; gap:0;}
.island-node{display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:64px; position:relative;}
.island-node:not(:last-child)::after{content:''; position:absolute; top:16px; left:50%; width:100%; height:2px; background:var(--border); z-index:0;}
.island-dot{width:32px;height:32px;border-radius:50%; border:3px solid var(--bg); display:flex; align-items:center; justify-content:center; position:relative; z-index:1; font-size:10px; font-weight:700; color:#fff;}
.island-label{font-size:9.5px; color:var(--mid); margin-top:6px; text-align:center; line-height:1.2; max-width:60px;}

.search-overlay{position:fixed; inset:0; background:var(--bg); z-index:150; display:none; flex-direction:column;}
.search-overlay.show{display:flex;}
.search-head{display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;}
.search-input-wrap{flex:1; display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:13px; padding:11px 13px;}
.search-input-wrap input{flex:1; border:none; background:none; outline:none; color:var(--hi); font-size:15px;}
.search-results{flex:1; overflow-y:auto; padding:4px 18px 30px;}
.search-group-title{font-size:11.5px; font-weight:700; color:var(--lo); margin:16px 0 8px; text-transform:none;}
.search-result-row{display:flex; align-items:center; gap:11px; padding:11px; border-radius:12px; border:1px solid var(--border); background:var(--card); margin-bottom:7px;}

.menu-sheet-item{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border);}
.menu-sheet-item:last-child{border-bottom:none;}

<!-- ================= FIREBASE ================= -->
<!-- Using the "compat" SDK (v10, global firebase namespace) so it drops
     straight into this file's plain script tags without a bundler. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   EDIT ME: paste your own Firebase project config below.
   Firebase console → Project settings → General → Your apps →
   SDK setup and configuration → Config.
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
/* ============================================================ */

const FIRESTORE_COLLECTION = 'scp_thaa_data';
let firebaseReady = false;

try {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
    console.warn('Firestore offline persistence unavailable:', err.code);
  });
  firebaseReady = true;

  /* window.storage-compatible API, backed by Firestore instead of the
     Claude-runtime storage or the localStorage fallback. Every existing
     get/set/delete/list call in the app works unchanged. */
  window.storage = {
    async get(key) {
      const doc = await db.collection(FIRESTORE_COLLECTION).doc(key).get();
      if (!doc.exists) throw new Error('Key not found: ' + key);
      return { key, value: doc.data().value };
    },
    async set(key, value) {
      await db.collection(FIRESTORE_COLLECTION).doc(key).set({
        value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      return { key, value };
    },
    async delete(key) {
      const ref = db.collection(FIRESTORE_COLLECTION).doc(key);
      const existed = (await ref.get()).exists;
      await ref.delete();
      return { key, deleted: existed };
    },
    async list(prefix) {
      let query = db.collection(FIRESTORE_COLLECTION);
      if (prefix) {
        query = query
          .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
          .where(firebase.firestore.FieldPath.documentId(), '<=', prefix + '\uf8ff');
      }
      const snap = await query.get();
      return { keys: snap.docs.map((d) => d.id), prefix };
    },
  };

  /* Live sync: when another device/tab writes to Firestore, pull the
     latest data and re-render. The first snapshot fires immediately on
     subscribe (that's the data loadPersisted() already read), so it's
     skipped to avoid a redundant render. */
  let _skipFirstSnapshot = true;
  db.collection(FIRESTORE_COLLECTION).onSnapshot(
    () => {
      if (_skipFirstSnapshot) { _skipFirstSnapshot = false; return; }
      if (typeof loadPersisted === 'function' && typeof render === 'function') {
        loadPersisted().then(() => { render(); toast('Synced latest data'); });
      }
    },
    (err) => console.warn('Firestore sync listener error:', err)
  );
} catch (e) {
  console.error('Firebase failed to initialize — check firebaseConfig.', e);
  firebaseReady = false;
}
</script>

const ATOLL_ICON = ICON.wave;

/* ================= SEEDED RNG ================= */
function seedFrom(str){let h=0; for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i); h|=0;} return Math.abs(h);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rand(seedStr){return mulberry32(seedFrom(seedStr));}

/* ================= STATIC REFERENCE DATA ================= */
const ATOLL = "Thaa";
const ISLANDS = ["Veymandoo", "Buruni", "Vandhoo", "Guraidhoo", "Madifushi", "Dhiyamigili", "Gaadhiffushi", "Hirilandhoo", "Kandoodhoo", "Kinbidhoo", "Omadhoo", "Thimarafushi", "Vilufushi"];
const CRIME_CATEGORIES = ["Theft","Assault","Drug-related","Domestic-related","Property offences","Traffic offences","Cyber-related","Other"];
const FIRST = ["Ahmed","Ibrahim","Hassan","Hussain","Mohamed","Ali","Abdulla","Yoosuf","Naseer","Waheed","Shifau","Rasheed","Zubair","Imran","Nazim","Suood","Fayaz","Naeem","Riyaz","Adam","Faisal","Shaheed","Latheef","Niyaz"];
const LAST = ["Didi","Manik","Waheed","Fulhu","Naseer","Rasheed","Saeed","Waheedh","Rilwan","Zahir","Firaq","Solih","Nadheem","Shareef","Hameed","Adnan"];
function randomName(seed){const r=rand(seed); const f=FIRST[Math.floor(r()*FIRST.length)]; const l=LAST[Math.floor(r()*LAST.length)]; return f+" "+l;}
const RANKS = ["Chief Inspector","Inspector","Sub-Inspector","Senior Sergeant","Sergeant"];
const STAFF_RANKS = ["Sergeant","Corporal","Police Constable"];
const ACT_TYPES = ["School Awareness","Youth Engagement","Community Meeting","Crime Prevention","Road Safety","Drug Prevention","Cyber Safety","Family Safety","Women's Safety","Children's Awareness","Stakeholder Meeting","Sports / Community Event","Other"];
const POLICE_POST_ISLANDS = ["Omadhoo", "Kandoodhoo", "Vandhoo", "Dhiyamigili", "Buruni"];

function buildStations(atoll, islands){
  return islands.map((island,idx)=>{
    const seed = atoll+"-"+island;
    const r = rand(seed);
    const closureRate = 0.55+r()*0.32;
    const isPost = POLICE_POST_ISLANDS.includes(island);
    return {
      id:atoll.toLowerCase()+"-"+idx,
      atoll, island,
      name: island+(isPost?" Police Post":" Police Station"),
      unitType: isPost?"Police Post":"Police Station",
      oic: randomName(seed+"-oic"),
      oicRank: RANKS[Math.floor(r()*2)],
      second: randomName(seed+"-2ic"),
      secondRank: RANKS[2+Math.floor(r()*2)],
      staffCount: 4+Math.floor(r()*14),
      phone: "+960 "+(600+Math.floor(r()*300))+" "+(1000+Math.floor(r()*8999)),
      status: r()>0.12 ? "Operational" : "Reduced Staffing",
      notes: r()>0.7 ? "Coastal patrol coverage extended through neighbouring island." : "Standard operations.",
      closureRate,
      trendBias: r()*2-1,
      leadershipHistory: r()>0.65 ? [{name:randomName(seed+"-prev"), rank:RANKS[Math.floor(r()*3)], from:"2022", to:"2025"}] : [],
      oicConfirmed: r()>0.22,
    };
  });
}
const STATIONS = buildStations(ATOLL, ISLANDS);
function stationById(id){return STATIONS.find(s=>s.id===id);}

/* ================= STATION STAFF ROSTER ================= */
function seedStaffFor(station){
  const out=[];
  const n = Math.max(0, station.staffCount-2);
  for(let i=0;i<n;i++){
    const seed = station.id+"-staff-"+i;
    const r = rand(seed);
    out.push({
      id:"staff-seed-"+i,
      name: randomName(seed+"-name"),
      rank: STAFF_RANKS[Math.floor(r()*STAFF_RANKS.length)],
      duty: r()>0.3 ? "On Duty" : "Off Duty",
    });
  }
  return out;
}
const SEED_STAFF_BY_STATION = {};
STATIONS.forEach(s=>{ SEED_STAFF_BY_STATION[s.id] = seedStaffFor(s); });


const NOW = new Date();
function monthsBack(n){
  const arr=[];
  for(let i=n-1;i>=0;i--){
    const d = new Date(NOW.getFullYear(), NOW.getMonth()-i, 1);
    arr.push({year:d.getFullYear(), month:d.getMonth(), label:d.toLocaleDateString('en-GB',{month:'short'}), key:d.getFullYear()+'-'+d.getMonth()});
  }
  return arr;
}
const MONTHS_24 = monthsBack(24);
const MONTHS_12 = MONTHS_24.slice(12);
const MONTHS_6 = MONTHS_24.slice(18);
const CUR = {year:NOW.getFullYear(), month:NOW.getMonth()};
const PREV_M = (()=>{const d=new Date(NOW.getFullYear(),NOW.getMonth()-1,1); return {year:d.getFullYear(),month:d.getMonth()};})();

/* ================= CRIME ENTRIES ================= */
let crimeEntries = [];
function seedCrimeEntries(){
  const out=[];
  STATIONS.forEach(s=>{
    const base = 3 + rand(s.id+"-base")()*9;
    CRIME_CATEGORIES.forEach(cat=>{
      const catShare = 0.4+rand(s.id+cat+"-share")()*1.4;
      MONTHS_24.forEach((m,mi)=>{
        const r = rand(s.id+cat+m.key);
        const trendFactor = 1 + s.trendBias*((mi-12)/24);
        const raw = base*catShare*0.14*trendFactor*(0.55+r()*0.9);
        const count = Math.max(0, Math.round(raw));
        if(count===0) return;
        const monthsAgo = 23-mi;
        const closeProb = monthsAgo<=1 ? 0.18 : Math.min(0.95, s.closureRate + monthsAgo*0.02);
        for(let c=0;c<count;c++){
          out.push({
            id: s.id+'|'+cat+'|'+m.key+'|'+c,
            stationId:s.id, category:cat, year:m.year, month:m.month, count:1,
            status: rand(s.id+cat+m.key+c+'st')() < closeProb ? 'closed':'pending',
            enteredBy:'Seed Record', enteredAt:new Date(m.year,m.month,1).toISOString(), manual:false
          });
        }
      });
    });
  });
  return out;
}
async function loadCrimeEntries(){
  crimeEntries = seedCrimeEntries();
  try{
    const res = await window.storage.get('scp:thaa:crimeEntries', true);
    if(res && res.value){ crimeEntries = crimeEntries.concat(JSON.parse(res.value)); }
  }catch(e){}
}
async function persistManualEntries(){
  const manual = crimeEntries.filter(e=>e.manual);
  try{ await window.storage.set('scp:thaa:crimeEntries', JSON.stringify(manual), true); }catch(e){}
}

function sumEntries(pred){ let n=0; for(const e of crimeEntries){ if(pred(e)) n+=e.count; } return n; }
function stationTotal(id, statusFilter){ return sumEntries(e=>e.stationId===id && (!statusFilter||e.status===statusFilter)); }
function stationInPeriod(id, year, month, statusFilter){ return sumEntries(e=>e.stationId===id && e.year===year && e.month===month && (!statusFilter||e.status===statusFilter)); }
function stationInYear(id, year, statusFilter){ return sumEntries(e=>e.stationId===id && e.year===year && (!statusFilter||e.status===statusFilter)); }
function stationCategories(id){ const o={}; CRIME_CATEGORIES.forEach(c=>o[c]=sumEntries(e=>e.stationId===id && e.category===c)); return o; }
function stationTopCategory(id){ const cats=stationCategories(id); return Object.entries(cats).sort((a,b)=>b[1]-a[1])[0]; }
function stationMonthlySeries(id, months){ return months.map(m=>stationInPeriod(id,m.year,m.month)); }
function stationChangePct(id){
  const cur = stationInPeriod(id, CUR.year, CUR.month);
  const prev = stationInPeriod(id, PREV_M.year, PREV_M.month);
  if(prev===0) return cur>0?100:0;
  return Math.round(((cur-prev)/prev)*100);
}
function atollAgg(){
  const list = STATIONS;
  const total = list.reduce((a,s)=>a+stationTotal(s.id),0);
  const closed = list.reduce((a,s)=>a+stationTotal(s.id,'closed'),0);
  const pending = list.reduce((a,s)=>a+stationTotal(s.id,'pending'),0);
  const month = list.reduce((a,s)=>a+stationInPeriod(s.id,CUR.year,CUR.month),0);
  const prevMonth = list.reduce((a,s)=>a+stationInPeriod(s.id,PREV_M.year,PREV_M.month),0);
  const year = list.reduce((a,s)=>a+stationInYear(s.id,CUR.year),0);
  const prevYear = list.reduce((a,s)=>a+stationInYear(s.id,CUR.year-1),0);
  const change = prevMonth===0 ? (month>0?100:0) : Math.round(((month-prevMonth)/prevMonth)*100);
  const categories={}; CRIME_CATEGORIES.forEach(c=>categories[c]=list.reduce((a,s)=>a+sumEntries(e=>e.stationId===s.id&&e.category===c),0));
  const topCat = Object.entries(categories).sort((a,b)=>b[1]-a[1])[0];
  const monthlyTrend12 = MONTHS_12.map(m=>list.reduce((a,s)=>a+stationInPeriod(s.id,m.year,m.month),0));
  return {atoll:ATOLL, total, closed, pending, month, prevMonth, year, prevYear, change, categories, topCat, monthlyTrend12, stations:list};
}
function stationStatusTag(s){
  const pending = stationTotal(s.id,'pending');
  const change = stationChangePct(s.id);
  if(change>=25 || pending>=25) return 'high';
  if(change>=10 || pending>=15) return 'attention';
  return 'normal';
}
const STATUS_LABEL = {normal:'Normal', attention:'Requires Review', high:'High Activity'};

<script>
function computeInsights(){
  const insights=[];
  const agg=atollAgg();
  if(agg.change>=12) insights.push({icon:ICON.trend,tone:'red',cat:'increasing',text:`<b>${ATOLL} Atoll</b> reports increased ${agg.change}% compared with the previous month.`});
  if(agg.change<=-10) insights.push({icon:ICON.trendDown,tone:'green',cat:'decreasing',text:`<b>${ATOLL} Atoll</b> reports decreased ${Math.abs(agg.change)}% compared with the previous month.`});

  const risers = STATIONS.filter(s=>stationChangePct(s.id)>=25).sort((a,b)=>stationChangePct(b.id)-stationChangePct(a.id)).slice(0,2);
  risers.forEach(s=>insights.push({icon:ICON.alert,tone:'red',cat:'significant',text:`<b>${s.name}</b> recorded a significant increase in reports this month (+${stationChangePct(s.id)}%).`}));

  STATIONS.forEach(s=>{
    const cur = stationTotal(s.id,'pending');
    const avg3 = MONTHS_12.slice(-4,-1).reduce((a,m)=>a+stationInPeriod(s.id,m.year,m.month),0)/3;
    if(avg3>0 && cur > avg3*1.4 && cur>=6){
      insights.push({icon:ICON.clock,tone:'amber',cat:'pending',text:`<b>${s.name}</b> has a higher pending workload than its previous three-month average.`});
    }
  });

  const improvers = STATIONS.filter(s=>stationChangePct(s.id)<=-20).sort((a,b)=>stationChangePct(a.id)-stationChangePct(b.id)).slice(0,1);
  improvers.forEach(s=>insights.push({icon:ICON.check,tone:'green',cat:'positive',text:`<b>${s.name}</b> shows a positive improvement, reports down ${Math.abs(stationChangePct(s.id))}% this month.`}));

  const thisMonthByStation={}, prevMonthByStation={};
  state.activities.forEach(a=>{
    const d=new Date(a.date);
    if(d.getMonth()===CUR.month && d.getFullYear()===CUR.year) thisMonthByStation[a.station]=(thisMonthByStation[a.station]||0)+1;
    if(d.getMonth()===PREV_M.month && d.getFullYear()===PREV_M.year) prevMonthByStation[a.station]=(prevMonthByStation[a.station]||0)+1;
  });
  const increasedEngagement = Object.keys(thisMonthByStation).filter(st=>thisMonthByStation[st] > (prevMonthByStation[st]||0));
  if(increasedEngagement.length>=1) insights.push({icon:ICON.handshake,tone:'blue',cat:'engagement',text:`<b>${increasedEngagement.length} station${increasedEngagement.length>1?'s':''}</b> recorded increased community engagement this month.`});

  const islandsWithActivity = new Set(state.activities.filter(a=>daysUntil(a.date) > -60).map(a=>a.island));
  const gapIslands = ISLANDS.filter(i=>!islandsWithActivity.has(i));
  if(gapIslands.length) insights.push({icon:ICON.megaphone,tone:'amber',cat:'engagement',text:`No community engagement recorded in the last 60 days on <b>${gapIslands.length} island${gapIslands.length>1?'s':''}</b>, including ${gapIslands.slice(0,2).join(', ')}.`});

  const catTotals={}; CRIME_CATEGORIES.forEach(c=>catTotals[c]=sumEntries(e=>e.category===c));
  const topCat = Object.entries(catTotals).sort((a,b)=>b[1]-a[1])[0];
  insights.push({icon:ICON.chart,tone:'blue',cat:'summary',text:`<b>${topCat[0]}</b> is the highest reported case category in ${ATOLL} Atoll (${topCat[1]} cases logged).`});
  return insights;
}
function toneColor(tone){return {red:'var(--red)',green:'var(--green)',amber:'var(--amber)',blue:'var(--blue)'}[tone];}
function toneSoft(tone){return {red:'var(--red-soft)',green:'var(--green-soft)',amber:'var(--amber-soft)',blue:'var(--blue-soft)'}[tone];}

function renderCommandInsights(compact){
  const insights=computeInsights();
  const list = compact ? insights.slice(0,4) : insights;
  return `
  <div class="section">
    <div class="section-head"><div><div class="section-title">Command Insights</div><div class="section-sub">Generated automatically from stored statistics</div></div></div>
    ${list.map(i=>`
      <div class="insight-card">
        <div class="insight-icon" style="background:${toneSoft(i.tone)}; color:${toneColor(i.tone)}">${i.icon}</div>
        <div><div class="insight-text">${i.text}</div></div>
      </div>`).join('')}
  </div>`;
}

function computeNotifications(){
  const out=[];
  Object.entries(state.submissions).forEach(([id,status])=>{
    if(status!=='Approved'){ const s=stationById(id); out.push({icon:ICON.file,tone:'amber',text:`Monthly statistics ${status==='Pending Review'?'awaiting review':'submitted, pending approval'} — <b>${s.name}</b>.`}); }
  });
  state.activities.filter(a=>a.followUpRequired && a.followUpDate).forEach(a=>{
    const du = daysUntil(a.followUpDate);
    if(du>=-2 && du<=3) out.push({icon:ICON.clock,tone: du<0?'red':'blue', text:`Follow-up ${du<0?'overdue':'due '+(du===0?'today':'in '+du+' day(s)')} — <b>${a.title}</b>, ${a.island}.`});
  });
  STATIONS.filter(s=>!s.oicConfirmed).slice(0,3).forEach(s=>out.push({icon:ICON.user,tone:'amber',text:`Station leadership information requires confirmation — <b>${s.name}</b>.`}));
  const counts={}; Object.values(state.submissions).forEach(v=>counts[v]=(counts[v]||0)+1);
  if((counts['Approved']||0)===STATIONS.length) out.push({icon:ICON.check,tone:'green',text:`Monthly ${ATOLL} report is ready — all ${STATIONS.length} stations approved.`});
  return out.concat(computeInsights().filter(i=>i.cat==='significant'||i.cat==='pending').map(i=>({icon:i.icon,tone:i.tone,text:i.text})));
}
function openNotifications(){
  const list = computeNotifications();
  openSheet(sheetShell('Notifications', `
    ${list.length? list.map(i=>`<div class="insight-card"><div class="insight-icon" style="background:${toneSoft(i.tone)};color:${toneColor(i.tone)}">${i.icon}</div><div class="insight-text">${i.text}</div></div>`).join('') : '<div class="empty">No new notifications.</div>'}
  `));
}

<script>
let paSubTab = 'activities';
function setPaSubTab(t){ paSubTab=t; render(); }
function renderPA(){
  const acts = state.activities;
  const thisMonth = acts.filter(a=> new Date(a.date).getMonth()===CUR.month && new Date(a.date).getFullYear()===CUR.year);
  const thisYear = acts.filter(a=> new Date(a.date).getFullYear()===CUR.year);

function renderPACalendar(){
  const items=[];
  state.activities.forEach(a=>items.push({date:a.date, title:a.title, sub:a.island+' · '+a.type, kind: daysUntil(a.date)>0?'upcoming':(a.followUpRequired?'follow-up':'completed')}));
  state.planner.filter(p=>p.status!=='Completed').forEach(p=>items.push({date:p.plannedDate, title:p.title, sub:p.targetIsland+' · Planned Campaign', kind:'planned'}));
  items.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const upcoming = items.filter(i=>daysUntil(i.date)>=0);
  const followUps = items.filter(i=>i.kind==='follow-up');
  const recent = items.filter(i=>daysUntil(i.date)<0 && i.kind!=='follow-up').slice(-6).reverse();
  const kindColor={upcoming:'var(--blue)',planned:'var(--blue)','follow-up':'var(--amber)',completed:'var(--green)'};
  function block(title, list){
    if(!list.length) return '';
    return `<div class="section-sub" style="margin:14px 0 8px;">${title}</div>` + list.map(i=>{
      const d=new Date(i.date);

  return `
    ${block('Follow-up Required', followUps)}
    ${block('Upcoming', upcoming)}
    ${block('Recently Completed', recent)}

  `;

        <span class="im">${ICON.users}~${p.expectedParticipants} expected</span>

      <div style="display:flex; gap:6px; margin-top:10px;">
        ${['Planned','Scheduled','Completed','Follow-up Required'].map(st=>`<button class="chip ${p.status===st?'active':''}" style="padding:5px 9px; font-size:10.5px;" onclick="setPlannerStatus('${p.id}','${st}')">${st}</button>`).join('')}
      </div>
    </div>`).join('')}
  `;

function setPlannerStatus(id, status){
  const p = state.planner.find(x=>x.id===id); if(p) p.status=status;
  persistPlanner(); render(); toast('Campaign status updated');
}

<script>
let CHARTS=[];
function destroyCharts(){ CHARTS.forEach(c=>c.destroy()); CHARTS=[]; }
function chartColors(){
  const dark = themeMode==='dark';
  return { grid: dark?'rgba(255,255,255,0.06)':'rgba(10,18,32,0.06)', text: dark?'rgba(244,247,252,0.55)':'rgba(11,20,36,0.5)', blue:getComputedAccent(), amber:'#E2A33D', green:'#3FA66B', red:'#D6524A'};

function getComputedAccent(){
  try{ return getComputedStyle(document.documentElement).getPropertyValue('--blue').trim() || '#1FA7A0'; }catch(e){ return '#1FA7A0'; }
}
function baseOpts(){
  const c=chartColors();
  return { responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{ x:{grid:{display:false}, ticks:{color:c.text, font:{size:10}}},
             y:{grid:{color:c.grid}, ticks:{color:c.text, font:{size:10}}, beginAtZero:true} } };

<script>
function openSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheetBackdrop').classList.add('show');
}
function closeSheet(){ document.getElementById('sheetBackdrop').classList.remove('show'); }
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('sheetBackdrop').addEventListener('click', e=>{ if(e.target.id==='sheetBackdrop') closeSheet(); });
});
function sheetShell(title, bodyHtml){
  return `<div class="sheet-handle"></div>
  <div class="sheet-head"><div class="sheet-title">${title}</div><button class="icon-btn" onclick="closeSheet()">${ICON.x}</button></div>
  <div class="sheet-body">${bodyHtml}</div>`;
}

let stationDetailTrendRange = 6;
function openStationDetail(id){ stationDetailTrendRange = 6; renderStationDetail(id); }
function renderStationDetail(id){
  const s = stationById(id);
  const oic = getOIC(s); const second = getSecondIC(s);
  const staff = getStaffRoster(s.id);

<script>
function openCrimeStatForm(preselectStationId){
  const stationOpts = STATIONS.map(s=>`<option value="${s.id}" ${s.id===preselectStationId?'selected':''}>${s.name}</option>`).join('');
  const monthOpts = MONTHS_12.slice().reverse().map(m=>`<option value="${m.year}-${m.month}">${m.label} ${m.year}</option>`).join('');
  openSheet(sheetShell('Add Crime Statistics', `
    <div class="meta-line" style="margin-top:0;">Entries are added to the aggregated dataset immediately — dashboards, charts and insights update on save. No personal or case-identifying information is collected.</div>
    <div class="divider"></div>
    <div class="field"><label>Station</label><select id="fStation">${stationOpts}</select></div>
    <div class="row2">
      <div class="field"><label>Category</label><select id="fCat">${CRIME_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Number of cases</label><input type="number" id="fCases" min="1" value="1"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Reporting month</label><select id="fMonth">${monthOpts}</select></div>
      <div class="field"><label>Initial status</label><select id="fStatus"><option value="pending">Pending</option><option value="closed">Closed</option></select></div>
    </div>
    <div class="field"><label>Notes (aggregated only)</label><textarea id="fNotes" placeholder="Optional summary notes"></textarea></div>
    <button class="btn-primary" onclick="submitCrimeStat()">Save Statistics</button>

    <div class="divider"></div>
    <div class="section-sub" style="margin-bottom:8px;">Update case status</div>
    <div class="meta-line" style="margin-top:0;">Move pending cases to closed once resolved.</div>
    <div class="row2" style="margin-top:10px;">
      <div class="field"><label>Station</label><select id="rStation">${stationOpts}</select></div>
      <div class="field"><label>Category</label><select id="rCat"><option value="">Any category</option>${CRIME_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Cases to mark closed</label><input type="number" id="rCount" min="1" value="1"></div>
    <button class="btn-ghost" onclick="resolveCases()">Mark Cases Closed</button>
  `));
}
function submitCrimeStat(){
  const stationId = document.getElementById('fStation').value;
  const category = document.getElementById('fCat').value;
  const count = Math.max(1, parseInt(document.getElementById('fCases').value)||1);
  const [year,month] = document.getElementById('fMonth').value.split('-').map(Number);
  const status = document.getElementById('fStatus').value;
  for(let i=0;i<count;i++){
    crimeEntries.push({ id:'manual-'+Date.now()+'-'+i, stationId, category, year, month, count:1, status, enteredBy: state.role, enteredAt: new Date().toISOString(), manual:true });
  }
  persistManualEntries();
  closeSheet(); render();
  toast(`${count} case(s) logged for ${stationById(stationId).name} — statistics updated`);
}
function resolveCases(){
  const stationId = document.getElementById('rStation').value;
  const category = document.getElementById('rCat').value;
  let toResolve = Math.max(1, parseInt(document.getElementById('rCount').value)||1);
  const pool = crimeEntries.filter(e=>e.stationId===stationId && e.status==='pending' && (!category||e.category===category));
  let resolved=0;
  for(const e of pool){ if(toResolve<=0) break; e.status='closed'; resolved++; toResolve--; }
  persistManualEntries();
  closeSheet(); render();
  toast(resolved ? `${resolved} case(s) marked closed` : 'No matching pending cases found');
}

/* ================= EDIT LEADERSHIP ================= */
function openEditLeadershipSheet(scope, id, role){
  let current, title, positionLabel;
  if(scope==='station'){
    const s = stationById(id);
    current = role==='second' ? getSecondIC(s) : getOIC(s);
    title = (role==='second' ? 'Edit Assistant — ' : 'Edit Officer in Charge — ') + s.name;
    positionLabel = role==='second' ? 'Assistant / Second-in-Command' : 'Officer in Charge';
  } else if(scope==='regional'){
    current = getRegionalLeader();
    title = 'Edit Regional Commander';
    positionLabel = 'Regional Commander';
  } else {
    current = getAtollLeader();
    title = 'Edit '+ATOLL+' Atoll Commander';
    positionLabel = 'Atoll Commander';
  }
  openSheet(sheetShell(title, `
    <div class="meta-line" style="margin-top:0;">Saving records the current holder in leadership history — nothing is deleted.</div>
    <div class="field" style="margin-top:14px;"><label>Name</label><input id="leadName" value="${current.name}"></div>
    <div class="row2">
      <div class="field"><label>Rank</label><select id="leadRank">${RANKS.concat(['Superintendent of Police','Assistant Commissioner of Police']).map(r=>`<option ${r===current.rank?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="field"><label>Contact</label><input id="leadPhone" value="${current.phone||''}"></div>
    </div>
    <div class="field"><label>Effective from</label><input id="leadFrom" placeholder="e.g. Sep 2026"></div>
    <button class="btn-primary" onclick="saveLeadershipEdit('${scope}','${id}','${role}')">Save ${positionLabel}</button>
  `));
}
function saveLeadershipEdit(scope, id, role){
  const name = document.getElementById('leadName').value.trim();
  const rank = document.getElementById('leadRank').value;
  const phone = document.getElementById('leadPhone').value.trim();
  const from = document.getElementById('leadFrom').value.trim() || '—';
  const toDate = new Date().toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  if(!name){ toast('Enter a name to save'); return; }

  if(scope==='station'){
    const s = stationById(id);
    const prev = role==='second' ? getSecondIC(s) : getOIC(s);
    const rec = state.leadershipOverrides.stations[id] || {history:[]};
    rec[role] = {name, rank, phone};
    rec.history = [...(rec.history||[]), {position: role==='second'?'Assistant / Second-in-Command':'Officer in Charge', name:prev.name, rank:prev.rank, from, to:toDate}];
    state.leadershipOverrides.stations[id] = rec;
  } else if(scope==='regional'){
    const prev = getRegionalLeader();
    const rec = state.leadershipOverrides.regional || {history:[]};
    const history = [...(rec.history||[]), {position:'Regional Commander', name:prev.name, rank:prev.rank, from, to:toDate}];
    state.leadershipOverrides.regional = {name, rank, phone, history};
  } else {
    const prev = getAtollLeader();
    const rec = state.leadershipOverrides.atoll || {history:[]};
    const history = [...(rec.history||[]), {position:'Atoll Commander', name:prev.name, rank:prev.rank, from, to:toDate}];
    state.leadershipOverrides.atoll = {name, rank, phone, history};
  }
  persistLeadership();
  closeSheet();
  toast(name+' saved');
  if(scope==='station'){ setTimeout(()=>openStationDetail(id),150); }
  else { render(); }
}

function openRoleSheet(){
  const roles=["Atoll Commander","Station Officer","Data/Staff User","Viewer"];
  openSheet(sheetShell('Switch Role View', `
    <div class="meta-line" style="margin-top:0;">Role-based access simulation — controls what this account can see and edit.</div>
    <div class="divider"></div>
    ${roles.map(r=>`<button class="btn-ghost" style="text-align:left; display:flex; align-items:center; justify-content:space-between;" onclick="setRole('${r}')">${r} ${state.role===r?ICON.check:''}</button>`).join('')}
  `));
}
function setRole(r){ state.role=r; closeSheet(); render(); toast('Viewing as: '+r); }

/* ================= COMPARISON (station vs station) ================= */
function openComparisonSheet(){ renderComparisonSheet(STATIONS[0].id, STATIONS[1] ? STATIONS[1].id : STATIONS[0].id); }
function renderComparisonSheet(aVal, bVal){
  const stationOpts = STATIONS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  openSheet(sheetShell('Compare Stations', `
    <div class="compare-select-row">
      <select id="cmpA" onchange="updateComparison()">${stationOpts}</select>
      <div class="swap-btn">${ICON.swap}</div>
      <select id="cmpB" onchange="updateComparison()">${stationOpts}</select>
    </div>
    <div id="cmpResults" style="margin-top:16px;"></div>
  `));
  setTimeout(()=>{
    document.getElementById('cmpA').value = aVal;
    document.getElementById('cmpB').value = bVal;
    updateComparison();
  },0);
}
function updateComparison(){
  const aSel=document.getElementById('cmpA').value, bSel=document.getElementById('cmpB').value;
  const sA=stationById(aSel), sB=stationById(bSel);
  const dataA={total:stationTotal(sA.id),pending:stationTotal(sA.id,'pending'),closed:stationTotal(sA.id,'closed'),categories:stationCategories(sA.id),monthlyTrend12:stationMonthlySeries(sA.id,MONTHS_12)};
  const dataB={total:stationTotal(sB.id),pending:stationTotal(sB.id,'pending'),closed:stationTotal(sB.id,'closed'),categories:stationCategories(sB.id),monthlyTrend12:stationMonthlySeries(sB.id,MONTHS_12)};
  const nameA=sA.name, nameB=sB.name;
  const engA=state.activities.filter(x=>x.station===sA.name).length, engB=state.activities.filter(x=>x.station===sB.name).length;
  document.getElementById('cmpResults').innerHTML = `
    <div class="row2">
      <div class="card"><div class="meta-line" style="margin-top:0;">${nameA} total</div><div style="font-size:20px; font-weight:700;">${dataA.total}</div></div>
      <div class="card"><div class="meta-line" style="margin-top:0;">${nameB} total</div><div style="font-size:20px; font-weight:700;">${dataB.total}</div></div>
      <div class="card"><div class="meta-line" style="margin-top:0;">${nameA} pending</div><div style="font-size:20px; font-weight:700; color:var(--amber);">${dataA.pending}</div></div>
      <div class="card"><div class="meta-line" style="margin-top:0;">${nameB} pending</div><div style="font-size:20px; font-weight:700; color:var(--amber);">${dataB.pending}</div></div>
      <div class="card"><div class="meta-line" style="margin-top:0;">${nameA} PA activities</div><div style="font-size:20px; font-weight:700; color:var(--green);">${engA}</div></div>
      <div class="card"><div class="meta-line" style="margin-top:0;">${nameB} PA activities</div><div style="font-size:20px; font-weight:700; color:var(--green);">${engB}</div></div>
    </div>
    <div class="section-sub" style="margin:16px 0 8px;">Crime trend (12 months)</div>
    <div class="chart-card"><div class="chart-wrap"><canvas id="cmpTrendChart"></canvas></div></div>
    <div class="section-sub" style="margin:16px 0 8px;">Category comparison</div>
    <div class="chart-card"><div class="chart-wrap" style="height:${CRIME_CATEGORIES.length*26}px;"><canvas id="cmpCatChart"></canvas></div></div>
  `;
  const c=chartColors();
  renderComparisonChart('cmpTrendChart', nameA, nameB, dataA.monthlyTrend12, dataB.monthlyTrend12, MONTHS_12.map(m=>m.label));
  setTimeout(()=>{
    const el=document.getElementById('cmpCatChart');
    if(el) CHARTS.push(new Chart(el,{type:'bar',data:{labels:CRIME_CATEGORIES,datasets:[
      {label:nameA,data:CRIME_CATEGORIES.map(k=>dataA.categories[k]),backgroundColor:c.blue,borderRadius:5},
      {label:nameB,data:CRIME_CATEGORIES.map(k=>dataB.categories[k]),backgroundColor:c.amber,borderRadius:5},
    ]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom',labels:{color:c.text,boxWidth:8,font:{size:10}}}},scales:{x:{grid:{color:c.grid},ticks:{color:c.text,font:{size:9}}},y:{grid:{display:false},ticks:{color:c.text,font:{size:9.5}}}}}}));
  },0);
}

/* ================= MAP ================= */
function openMapSheet(){
  openSheet(sheetShell('Island Coverage Map', `
    <div class="meta-line" style="margin-top:0;">Visual coverage overview — not for precise operational tracking. Tap an island for station detail.</div>
    ${renderIslandChain()}
  `));
}

/* ================= SUBMISSION STATUS ================= */
function openSubmissionSheet(){ renderSubmissionSheet(); }
function renderSubmissionSheet(){
  const colors={Approved:'var(--green)',Submitted:'var(--blue)','Pending Review':'var(--amber)'};
  openSheet(sheetShell('Monthly Submission Status', `
    <div class="meta-line" style="margin-top:0;">Current reporting period — tap a station to cycle its status.</div>
    <div class="submission-grid" style="margin-top:14px;">
      ${STATIONS.map(s=>`<div class="sub-cell" title="${s.name}: ${state.submissions[s.id]}" style="background:${colors[state.submissions[s.id]]}; cursor:pointer;" onclick="cycleSubmission('${s.id}')">${initials(s.island)}</div>`).join('')}
    </div>
    <div class="legend-row">
      ${Object.entries(colors).map(([k,v])=>`<div class="legend-item"><span class="legend-dot" style="background:${v}"></span>${k}</div>`).join('')}
    </div>
    <div class="divider"></div>
    ${STATIONS.map(s=>`<div class="report-row"><div style="flex:1;"><div style="font-size:13px; font-weight:600;">${s.name}</div></div><span class="status-tag ${state.submissions[s.id]==='Approved'?'normal':state.submissions[s.id]==='Submitted'?'attention':'high'}">${state.submissions[s.id]}</span></div>`).join('')}
  `));
}
function cycleSubmission(id){
  const order=['Pending Review','Submitted','Approved'];
  const cur=state.submissions[id]; const next=order[(order.indexOf(cur)+1)%order.length];
  state.submissions[id]=next; persistSubmissions();
  renderSubmissionSheet(); toast(stationById(id).name+': '+next);
}

/* ================= REPORTS ================= */
function openReportsSheet(){
  const reports=[ATOLL+' Monthly Report','Station Monthly Report','Crime Trend Report','Community Engagement Report','Public Awareness Campaign Report','Annual Statistics Report'];
  openSheet(sheetShell('Reports', `
    <div class="meta-line" style="margin-top:0;">Generate and export command reports for ${state.filterPeriod.toLowerCase()}.</div>
    <div class="divider"></div>
    ${reports.map(r=>`
      <div class="report-row">
        <div class="report-icon">${ICON.file}</div>
        <div style="flex:1;"><div style="font-size:13.5px; font-weight:700;">${r}</div><div class="meta-line" style="margin-top:2px;">${ATOLL} · ${state.filterPeriod}</div></div>
        <div class="report-actions">
          <button onclick="downloadCSV()">CSV</button>
          <button onclick="printReport()">Print</button>
        </div>
      </div>`).join('')}
  `));
}
function csvFromStations(){
  const header=['Station','Island','OIC','Total','This Month','This Year','Closed','Pending','% Change vs Last Month'];
  const rows=STATIONS.map(s=>{const o=getOIC(s); return [s.name,s.island,o.name,stationTotal(s.id),stationInPeriod(s.id,CUR.year,CUR.month),stationInYear(s.id,CUR.year),stationTotal(s.id,'closed'),stationTotal(s.id,'pending'),stationChangePct(s.id)];});
  return [header,...rows].map(r=>r.join(',')).join('\n');
}
function downloadCSV(){
  const blob=new Blob([csvFromStations()],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='thaa-police-report.csv'; a.click();
  toast('CSV exported');
}
function printReport(){ window.print(); }
</script>
<script>
function openSearch(){
  document.getElementById('searchOverlay').classList.add('show');
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').innerHTML = '<div class="empty">Search stations, islands, officers, activities…</div>';
  setTimeout(()=>document.getElementById('searchInput').focus(),150);
}
function closeSearch(){ document.getElementById('searchOverlay').classList.remove('show'); }
function runSearch(qRaw){
  const q = qRaw.trim().toLowerCase();
  const box = document.getElementById('searchResults');
  if(!q){ box.innerHTML = '<div class="empty">Search stations, islands, officers, activities…</div>'; return; }
  const stationMatches = STATIONS.filter(s=>{
    const o=getOIC(s);
    return s.name.toLowerCase().includes(q) || s.island.toLowerCase().includes(q) || o.name.toLowerCase().includes(q);
  }).slice(0,8);
  const activityMatches = state.activities.filter(a=>a.title.toLowerCase().includes(q) || a.island.toLowerCase().includes(q) || a.officer.toLowerCase().includes(q)).slice(0,6);
  let html='';
  if(stationMatches.length){
    html += `<div class="search-group-title">Stations & Officers</div>`;
    html += stationMatches.map(s=>{
      const o=getOIC(s); const pending=stationTotal(s.id,'pending'); const recentPA=state.activities.filter(a=>a.station===s.name).length;
      return `<div class="search-result-row" onclick="closeSearch(); openStationDetail('${s.id}')">
        <div class="station-avatar" style="width:34px;height:34px;">${initials(s.island)}</div>
        <div style="flex:1;"><div style="font-size:13.5px; font-weight:700;">${s.name}</div><div class="meta-line" style="margin-top:1px;">OIC: ${o.name} · ${pending} pending · ${recentPA} PA activities</div></div>
        ${ICON.chevR}
      </div>`;
    }).join('');
  }
  if(activityMatches.length){
    html += `<div class="search-group-title">Community Activities</div>`;
    html += activityMatches.map(a=>`<div class="search-result-row"><div class="menu-sheet-icon">${ICON.handshake}</div><div style="flex:1;"><div style="font-size:13px; font-weight:700;">${a.title}</div><div class="meta-line" style="margin-top:1px;">${a.island} · ${fmtDate(a.date)}${a.followUpRequired?' · Follow-up pending':''}</div></div></div>`).join('');
  }
  if(!stationMatches.length && !activityMatches.length){ html = '<div class="empty">No results found.</div>'; }
  box.innerHTML = html;
}
</script>

loadPersisted().then(render).then(()=>{
  if (typeof firebaseReady !== 'undefined' && !firebaseReady) {
    setTimeout(()=>toast('Firebase not configured — changes will not be saved. Edit firebaseConfig in index.html.'), 1200);
  }
});
</script>
